[platformio]
src_dir = src
; Build the stock Meshtastic env for your board (Heltec Wireless Stick Lite V3, ESP32-S3)
default_envs = heltec_v3_tg_standalone

[env:heltec_v3_tg_standalone]
; Inherit EVERYTHING from the official env so radio/crypto/protobuf/etc. are present
extends = env:heltec-wsl-v3

; Don’t prune sources – the stock env knows what to build
; (If you leave custom filters, you’ll keep tripping missing libs.)
; build_src_filter =

; Keep the base flags; add only minimal, safe overrides
build_flags =
  ${env:heltec-wsl-v3.build_flags}
  -DSTATUS_UPDATE_INTERVAL_S=60 ;86400
  ; -DUSE_MAX1704X       ; <-- leave commented until you really add the MAX1704x lib

; Rely on Meshtastic’s lib_deps from the base env.
; Adding extra ones here has caused the earlier “UnknownPackageError”.
; lib_deps =

monitor_speed = 115200
; upload_port  = /dev/ttyACM0
; monitor_port = /dev/ttyACM0

[env:heltec-v3]
extends = env:heltec_v3_tg_standalone